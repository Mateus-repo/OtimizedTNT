plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

loom {
    runs {
        server {
            server()
            name = "Server"
            ideConfigGenerated(true)
            runDir('run/server')
        }
    }
}

dependencies {
    // Mojmap: o Loom mapeia com as mappings oficiais do Mojang
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Sem Fabric API: só o loader (trá o Mixin e o Brigadier transitivamente)
    implementation "net.fabricmc:fabric-loader:${loader_version}"

    // Testes do núcleo (sem dependência do Minecraft)
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "description", project.mod_description
    inputs.property "author", project.mod_author
    inputs.property "license", project.mod_license
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "java_version", project.java_version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "description": project.mod_description,
            "author": project.mod_author,
            "license": project.mod_license,
            "loader_version": project.loader_version,
            "minecraft_version": project.minecraft_version,
            "java_version": project.java_version
        )
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
